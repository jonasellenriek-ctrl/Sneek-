# Sneek – Konfiguration des Deal-Bots
# Alles hier kann angepasst werden, ohne Code zu ändern.

# Täglicher E-Mail-Report
report:
  # immer schicken, auch wenn nichts gefunden wurde (damit du siehst, dass er läuft)
  send_empty: true
  max_deals: 150

# Bewertung 1–10: wie stark jeder Faktor in die Gesamtnote eingeht
rating_weights:
  rabatt: 0.30
  preis: 0.20
  modell: 0.25
  groesse: 0.15
  shop: 0.10

# Ab welchem Rabatt (in %) gemeldet wird
min_discount_percent: 40

# Schwerpunkt-Modelle: eigene Sektion ganz oben im Report ("Kobe-Radar"),
# Extra-Suchen und niedrigere Rabatt-Schwelle, weil Kobes in US 16 selten sind.
focus:
  name: "Kobe-Radar"
  keywords:
    - kobe
    - mamba
  min_discount_percent: 20

# Nur Schuhe melden, deren Preis für US 16 auf der Shop-Seite bestätigt wurde.
# true = zusätzlich ungeprüfte Treffer anzeigen (mit Warnhinweis)
show_unverified: false

# Optional: Maximalpreis (in Shop-Währung). null = egal
max_price: null

# Größen-Bezeichnungen, die als "US 16" gelten.
# Shops schreiben Größen sehr unterschiedlich (US / UK / EU, je nach Marke).
#   Nike/Jordan: US 16 = UK 15 = EU 50.5
#   adidas:      US 16 = UK 15.5 = EU 51 1/3
#   Puma/NB/UA weichen teils ab – bei Bedarf ergänzen.
size_aliases:
  - "US 16"
  - "US16"
  - "M 16"
  - "16"
  - "UK 15"
  - "UK 15.5"
  - "EU 50.5"
  - "50.5"
  - "50,5"
  - "51 1/3"
  - "51.3"

# Woran ein Basketballschuh erkannt wird (Titel, Produkttyp, Tags; Groß/klein egal)
basketball_keywords:
  - basketball
  - bball
  - hoop
  - lebron
  - kobe
  - giannis
  - "kd "
  - "kd1"
  - "ja 1"
  - "ja 2"
  - "ja 3"
  - sabrina
  - harden
  - "dame "
  - curry
  - "ae 1"
  - zion
  - luka
  - tatum
  - "mb.0"
  - lamelo
  - "trae young"
  - "g.t. cut"
  - "gt cut"
  - "gt jump"
  - "gt hustle"
  - "air jordan"
  - "jordan "
  - "anthony edwards"
  - "way of wade"
  - "freak "

# Diese Wörter schließen ein Produkt aus (z. B. Kinder-Schuhe, Bälle, Socken)
exclude_keywords:
  - "(gs)"
  - "(ps)"
  - "(td)"
  - kids
  - kinder
  - "grade school"
  - socks
  - socken
  - " ball "
  - shorts
  - jersey
  - trikot
  - slide
  - hoodie
  - "t-shirt"
  - " tee "
  - " cap "
  - pants
  - jogger
  - backpack
  - rucksack

sources:
  # Shopify-Shops: werden direkt über ihre öffentliche Produkt-Schnittstelle
  # durchsucht (genaue Größen- und Preisdaten). Beliebig erweiterbar.
  shopify:
    enabled: true
    max_pages: 8          # je 250 Produkte
    shops:
      - https://www.shoepalace.com
      - https://www.jimmyjazz.com
      - https://www.dtlr.com
      - https://www.sneakerpolitics.com
      - https://www.a-ma-maniere.com
      - https://www.socialstatuspgh.com
      - https://kith.com
      - https://undefeated.com
      - https://bdgastore.com
      - https://cncpts.com
      - https://www.overkillshop.com
      - https://www.allikestore.com

  # Google Shopping über SerpAPI = "das gesamte Internet" (Zalando, About You,
  # Snipes, Foot Locker, Nike, adidas, Kickz, Amazon, eBay, ...).
  # Braucht den Secret SERPAPI_KEY (kostenloses Kontingent reicht bei 2x täglich).
  google_shopping:
    enabled: true
    min_interval_hours: 20  # 1x pro Tag, spart API-Kontingent
    # Direkte Shop-Links: kostet 1 Abfrage je neuem Schuh (wird gemerkt).
    # Höchstens so viele pro Tag – Kobe zuerst.
    resolve_links_per_run: 6
    country: de
    language: de
    queries:
      # Schwerpunkt Kobe (6 Suchen/Tag ≈ 180/Monat – passt ins Gratis-Kontingent)
      - "Nike Kobe Größe 50.5"
      - "Nike Kobe Protro size 16"
      - "Nike Kobe 6 8 9 sale EU 50.5"
      # allgemein
      - "Basketballschuhe Herren Größe 50.5 Sale"
      - "basketball shoes size 16 sale"
      - "Nike Basketballschuh 50.5 reduziert"

  # StockX & GOAT mit exaktem Preis für US 16 – über die KicksDB-API (kicks.dev).
  # Braucht den Secret KICKSDB_API_KEY. Jede Suche = 1 Anfrage je Plattform.
  marketplaces:
    enabled: true
    us_size: "16"
    platforms: [stockx, goat]
    stockx_market: DE      # Preise in EUR für Deutschland
    goat_market: NL        # GOAT bietet EUR nur über NL
    # Rabatt gegenüber UVP bzw. Ø-Preis aller Größen
    min_discount_percent: 15
    queries:
      - "kobe 4 protro"
      - "kobe 5 protro"
      - "kobe 6 protro"
      - "kobe 8 protro"
      - "kobe 9"
      - "kobe 11"
      - "sabrina"
      - "gt cut"
      - "anthony edwards"
      - "lebron"

  # Shopping-Clubs (Zalando Lounge, BestSecret): nur mit Login sichtbar, deshalb
  # wertet der Bot deren Newsletter in deinem Postfach aus (IMAP, z. B. GMX).
  # Braucht die Secrets IMAP_HOST, IMAP_USER, IMAP_PASSWORD.
  # Wichtig: Newsletter beider Shops im jeweiligen Konto aktivieren.
  newsletter_mail:
    enabled: true
    lookback_days: 2
    clubs:
      - name: Zalando Lounge
        sender_contains: "zalando-lounge"
        url: "https://www.zalando-lounge.de/"
      - name: BestSecret
        sender_contains: "bestsecret"
        url: "https://www.bestsecret.com/"
    keywords:
      - basketball
      - nike
      - jordan
      - adidas
      - puma
      - "under armour"
      - "new balance"
      - sneaker
      - sportschuhe
      - "big size"
      - "große größen"
      - "xxl"
