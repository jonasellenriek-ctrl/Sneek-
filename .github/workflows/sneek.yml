name: Sneek Tages-Report

on:
  schedule:
    - cron: "17 6 * * *"     # täglich ~07:17 Uhr (Winterzeit) / 08:17 (Sommerzeit)
  workflow_dispatch:          # manuell starten über "Run workflow"
    inputs:
      force:
        description: "Google-Suche erzwingen (auch wenn heute schon gesucht)"
        type: boolean
        default: true
      mail:
        description: "Report per E-Mail senden"
        type: boolean
        default: true

permissions:
  contents: write             # um state/seen.json zu speichern

concurrency:
  group: sneek
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Suchen und Report mailen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SNEEK_FORCE: ${{ inputs.force }}
          SNEEK_NO_MAIL: ${{ inputs.mail == false && 'true' || '' }}
          KICKSDB_API_KEY: ${{ secrets.KICKSDB_API_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m sneek.main --preview report.html
      - name: Report als Datei aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Bereits gemeldete Deals speichern
        run: |
          git config user.name "sneek-bot"
          git config user.email "sneek-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "state: update seen deals [skip ci]" && git pull --rebase && git push)
